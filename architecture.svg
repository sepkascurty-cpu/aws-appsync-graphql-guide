<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C4FFF"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DD344C"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF9900"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4053D6"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#232F3E">Amazon AppSync — GraphQL API, Real-Time by Default</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#5a6b7d">One GraphQL endpoint: clients ask for exactly the data they need, and get live updates pushed back</text>

  <!-- ===== Edge row ===== -->
  <!-- Clients -->
  <g>
    <rect x="20" y="90" width="150" height="76" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1.5"/>
    <text x="95" y="118" text-anchor="middle" font-size="26">&#128187;</text>
    <text x="95" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Clients</text>
    <text x="95" y="158" text-anchor="middle" font-size="11" fill="#5a6b7d">Web &amp; mobile apps</text>
  </g>

  <!-- Route 53 -->
  <g>
    <rect x="230" y="90" width="150" height="76" rx="6" fill="#8C4FFF"/>
    <text x="305" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon Route 53</text>
    <text x="305" y="140" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">DNS service</text>
    <text x="305" y="158" text-anchor="middle" font-size="11" fill="#e8ddff">api.example.com</text>
  </g>

  <!-- CloudFront -->
  <g>
    <rect x="440" y="90" width="150" height="76" rx="6" fill="#8C4FFF"/>
    <text x="515" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon CloudFront</text>
    <text x="515" y="140" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">CDN</text>
    <text x="515" y="158" text-anchor="middle" font-size="11" fill="#e8ddff">edge caching</text>
  </g>

  <!-- WAF -->
  <g>
    <rect x="650" y="90" width="150" height="76" rx="6" fill="#DD344C"/>
    <text x="725" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AWS WAF</text>
    <text x="725" y="140" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">Web Application Firewall</text>
    <text x="725" y="158" text-anchor="middle" font-size="11" fill="#ffd9de">blocks bad traffic</text>
  </g>

  <!-- Edge arrows -->
  <line x1="172" y1="128" x2="226" y2="128" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="199" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#4a4a4a">DNS lookup</text>
  <line x1="382" y1="128" x2="436" y2="128" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="409" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#4a4a4a">route to edge</text>
  <line x1="592" y1="128" x2="646" y2="128" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="619" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#4a4a4a">inspect</text>

  <!-- Shield note -->
  <g>
    <rect x="850" y="96" width="130" height="64" rx="6" fill="#DD344C"/>
    <text x="915" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">AWS Shield</text>
    <text x="915" y="141" text-anchor="middle" font-size="11" font-style="italic" fill="#ffffff">DDoS protection</text>
  </g>

  <!-- ===== AppSync + Cognito row ===== -->
  <!-- Cognito -->
  <g>
    <rect x="20" y="210" width="190" height="86" rx="6" fill="#DD344C"/>
    <text x="115" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon Cognito</text>
    <text x="115" y="260" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">User Pool</text>
    <text x="115" y="278" text-anchor="middle" font-size="11" fill="#ffd9de">sign-up / sign-in, JWT</text>
  </g>

  <!-- AppSync -->
  <g>
    <rect x="360" y="200" width="280" height="106" rx="6" fill="#8C4FFF"/>
    <text x="500" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AWS AppSync</text>
    <text x="500" y="252" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">GraphQL API</text>
    <text x="500" y="272" text-anchor="middle" font-size="11" fill="#e8ddff">schema + unit &amp; pipeline resolvers</text>
    <text x="500" y="290" text-anchor="middle" font-size="11" fill="#e8ddff">queries · mutations · subscriptions</text>
  </g>

  <!-- Cognito -> AppSync -->
  <line x1="212" y1="253" x2="356" y2="253" stroke="#DD344C" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="284" y="241" text-anchor="middle" font-size="11" font-weight="600" fill="#DD344C">verify JWT</text>

  <!-- WAF -> AppSync -->
  <path d="M 725 168 L 725 196 Q 725 200 719 200 L 560 200" stroke="#8C4FFF" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="760" y="190" text-anchor="start" font-size="11" font-weight="600" fill="#8C4FFF">GraphQL over HTTPS</text>

  <!-- ===== AWS Cloud boundary ===== -->
  <rect x="20" y="330" width="960" height="440" rx="8" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="48" y="358" font-size="15" font-weight="700" fill="#232F3E">AWS Cloud</text>

  <!-- VPC -->
  <rect x="40" y="372" width="640" height="380" rx="6" fill="none" stroke="#7AA116" stroke-width="2"/>
  <text x="62" y="398" font-size="14" font-weight="700" fill="#7AA116">VPC</text>

  <!-- Availability Zone 1 -->
  <rect x="60" y="410" width="290" height="326" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="205" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#4a90d9">Availability Zone 1</text>

  <!-- AZ1 App subnet -->
  <rect x="76" y="444" width="258" height="120" rx="6" fill="#eef7e6" stroke="#7AA116" stroke-width="1"/>
  <text x="205" y="464" text-anchor="middle" font-size="12" font-weight="700" fill="#5b7a1e">App Subnet (private)</text>
  <rect x="96" y="474" width="218" height="76" rx="6" fill="#FF9900"/>
  <text x="205" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AWS Lambda</text>
  <text x="205" y="521" text-anchor="middle" font-size="11" font-style="italic" fill="#ffffff">resolver functions</text>
  <text x="205" y="538" text-anchor="middle" font-size="11" fill="#fff3d6">validation · enrichment</text>

  <!-- AZ1 DB subnet -->
  <rect x="76" y="578" width="258" height="142" rx="6" fill="#e8eefc" stroke="#4053D6" stroke-width="1"/>
  <text x="205" y="598" text-anchor="middle" font-size="12" font-weight="700" fill="#2e3a9e">DB Subnet (private)</text>
  <rect x="96" y="608" width="218" height="96" rx="6" fill="#4053D6"/>
  <text x="205" y="638" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon Aurora</text>
  <text x="205" y="657" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">Serverless v2</text>
  <text x="205" y="676" text-anchor="middle" font-size="11" fill="#dfe4ff">relational data · writer</text>
  <text x="205" y="692" text-anchor="middle" font-size="11" fill="#dfe4ff">DB subnet group</text>

  <!-- Availability Zone 2 -->
  <rect x="370" y="410" width="290" height="326" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="515" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#4a90d9">Availability Zone 2</text>

  <!-- AZ2 App subnet -->
  <rect x="386" y="444" width="258" height="120" rx="6" fill="#eef7e6" stroke="#7AA116" stroke-width="1"/>
  <text x="515" y="464" text-anchor="middle" font-size="12" font-weight="700" fill="#5b7a1e">App Subnet (private)</text>
  <rect x="406" y="474" width="218" height="76" rx="6" fill="#FF9900"/>
  <text x="515" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AWS Lambda</text>
  <text x="515" y="521" text-anchor="middle" font-size="11" font-style="italic" fill="#ffffff">resolver functions</text>
  <text x="515" y="538" text-anchor="middle" font-size="11" fill="#fff3d6">validation · enrichment</text>

  <!-- AZ2 DB subnet -->
  <rect x="386" y="578" width="258" height="142" rx="6" fill="#e8eefc" stroke="#4053D6" stroke-width="1"/>
  <text x="515" y="598" text-anchor="middle" font-size="12" font-weight="700" fill="#2e3a9e">DB Subnet (private)</text>
  <rect x="406" y="608" width="218" height="96" rx="6" fill="#4053D6"/>
  <text x="515" y="638" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon Aurora</text>
  <text x="515" y="657" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">Serverless v2</text>
  <text x="515" y="676" text-anchor="middle" font-size="11" fill="#dfe4ff">relational data · reader</text>
  <text x="515" y="692" text-anchor="middle" font-size="11" fill="#dfe4ff">DB subnet group</text>

  <!-- DynamoDB (regional, right of VPC) -->
  <g>
    <rect x="710" y="410" width="240" height="150" rx="6" fill="#4053D6"/>
    <text x="830" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon DynamoDB</text>
    <text x="830" y="462" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">app tables</text>
    <text x="830" y="484" text-anchor="middle" font-size="11" fill="#dfe4ff">Orders · Users · Products</text>
    <text x="830" y="504" text-anchor="middle" font-size="11" fill="#dfe4ff">regional — multi-AZ by design</text>
    <text x="830" y="524" text-anchor="middle" font-size="11" fill="#dfe4ff">on-demand capacity</text>
    <text x="830" y="544" text-anchor="middle" font-size="11" fill="#dfe4ff">point-in-time recovery on</text>
  </g>

  <!-- CloudWatch -->
  <g>
    <rect x="710" y="590" width="240" height="130" rx="6" fill="#D13239"/>
    <text x="830" y="622" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon CloudWatch</text>
    <text x="830" y="642" text-anchor="middle" font-size="12" font-style="italic" fill="#ffffff">Logs · Metrics · Alarms</text>
    <text x="830" y="664" text-anchor="middle" font-size="11" fill="#ffd9de">request logs &amp; latency</text>
    <text x="830" y="684" text-anchor="middle" font-size="11" fill="#ffd9de">4XX / 5XX error alarms</text>
    <text x="830" y="704" text-anchor="middle" font-size="11" fill="#ffd9de">resolver tracing</text>
  </g>

  <!-- AppSync -> Lambda AZ1 -->
  <path d="M 430 306 L 205 306 L 205 444" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="316" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#c77400">invoke resolver</text>

  <!-- AppSync -> Lambda AZ2 -->
  <path d="M 570 306 L 515 306 L 515 444" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="556" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#c77400">invoke resolver</text>

  <!-- AppSync -> DynamoDB -->
  <path d="M 640 240 L 706 240 L 706 470" stroke="#4053D6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="672" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#4053D6">GetItem / Query</text>

  <!-- Lambda AZ1 -> Aurora AZ1 -->
  <line x1="205" y1="552" x2="205" y2="604" stroke="#4053D6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="216" y="582" text-anchor="start" font-size="11" font-weight="600" fill="#4053D6">SQL via Data API</text>

  <!-- Lambda AZ2 -> Aurora AZ2 -->
  <line x1="515" y1="552" x2="515" y2="604" stroke="#4053D6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="526" y="582" text-anchor="start" font-size="11" font-weight="600" fill="#4053D6">SQL via Data API</text>

  <!-- AppSync -> CloudWatch -->
  <path d="M 640 290 L 830 290 L 830 586" stroke="#D13239" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="736" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#D13239">logs &amp; metrics</text>

  <!-- Subscription note -->
  <text x="500" y="786" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7d">Subscriptions: AppSync holds the WebSocket — when a mutation runs, matching subscribers get the update pushed automatically.</text>
</svg>
